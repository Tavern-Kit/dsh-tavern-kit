<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">给小酒馆换个装扮</title>
  <desc id="desc">奶白纸面上的两片嫩叶，随风轻摆后停稳。</desc>
  <style>
    .sprout { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 2000ms cubic-bezier(0.77, 0, 0.175, 1) 2; }
    @keyframes sway { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-5deg); } 70% { transform: rotate(4deg); } }
    @keyframes welcome { from { opacity: .65; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sprout { animation: welcome 200ms ease 1; } }
  </style>
  <circle cx="32" cy="32" r="29" fill="#fffcf2"/>
  <g class="sprout" stroke="#586748" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 48V32" fill="none"/>
    <path d="M31 34C15 35 12 25 13 18c13 0 20 5 18 16Z" fill="#bbc79e"/>
    <path d="M32 29c-2-12 6-18 20-18 0 13-7 21-20 18Z" fill="#a7b489"/>
    <path d="m20 24 12 11m12-16L32 31" fill="none"/>
  </g>
  <path d="M20 48h24l-3 8H23Z" fill="#dfbd84" stroke="#544633" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
